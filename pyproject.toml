[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khatakshetra-book-factory"
version = "0.10.0"
description = "Offline-first control plane for the Khatakshetra Book Factory"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10,<13",
  "reportlab>=4,<5",
  "pypdf>=5,<7",
]

[project.scripts]
factory = "book_factory.cli:main"

[tool.setuptools.packages.find]
include = ["book_factory*"]
