[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khatakshetra-book-factory"
version = "0.4.0"
description = "Offline-first control plane for the Khatakshetra Book Factory"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
factory = "book_factory.cli:main"

[tool.setuptools.packages.find]
include = ["book_factory*"]
